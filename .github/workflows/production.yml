# production 的晋级 / 改灰度，须经 production environment 的人工批准（tinyui docs/updates.md §6.2）。
# 回滚 = 在本仓 revert 合入 main（发一个内容等于旧版的新版本）再 promote：指针只往前走
name: Production

on:
  workflow_dispatch:
    inputs:
      action:
        description: "promote: 把 staging 上的某版晋级；rollout: 改当前版的灰度百分比"
        type: choice
        options: [promote, rollout]
        required: true
      version:
        description: "promote 的包版本（tinyui releases list 可查）"
        required: false
      percent:
        description: "rollout 的百分比 0-100"
        required: false
      host_version:
        description: "宿主版本"
        default: "5"
        required: true

# 同一 production 指针的操作串行，免得两次已批准的操作互相覆盖
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run
        env:
          TINYUI_TOKEN: ${{ secrets.TINYUI_PRODUCTION_TOKEN }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          PERCENT: ${{ inputs.percent }}
          HOST_VERSION: ${{ inputs.host_version }}
        run: |
          set -eu
          case "$ACTION" in
            promote) [ -n "$VERSION" ] || { echo "::error::$ACTION 需要 version"; exit 1; } ;;
            rollout) echo "$PERCENT" | grep -Eq '^([0-9]|[1-9][0-9]|100)$' || { echo "::error::rollout 需要 0-100 的整数 percent"; exit 1; } ;;
          esac
          case "$ACTION" in
            promote)  pnpm exec tinyui releases promote "$VERSION" --host-version "$HOST_VERSION" --to production --app trendingai ;;
            rollout)  pnpm exec tinyui releases rollout "$PERCENT" --host-version "$HOST_VERSION" --channel production --app trendingai ;;
          esac
          pnpm exec tinyui releases list --host-version "$HOST_VERSION" --app trendingai
